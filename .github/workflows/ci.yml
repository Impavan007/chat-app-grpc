name: CI/CD Pipeline

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔹 Install backend deps
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      # 🔹 Install frontend deps
      - name: Install Frontend Dependencies
        run: |
          cd chat-frontend
          npm install

      # 🔹 Build frontend
      - name: Build Frontend
        run: |
          cd chat-frontend
          npm run build

      # 🔐 Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 Build & push backend
      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/chat-backend ./backend

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/chat-backend

      # 🐳 Build & push gRPC
      - name: Build gRPC Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/chat-grpc ./grpc

      - name: Push gRPC Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/chat-grpc

      # 🐳 Build & push frontend
      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/chat-frontend ./chat-frontend

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/chat-frontend